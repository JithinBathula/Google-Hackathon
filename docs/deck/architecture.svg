"/><circle cx="265.0" cy="511" r="22" fill="#1A73E822" stroke="none" stroke-width="0"/><g transform="translate(251.0,497) scale(1.15)" fill="none" stroke="#1A73E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3,10 h18 M8,3 v4 M16,3 v4"/></g><text x="265.0" y="555" font-size="15" font-weight="700" fill="#202124" text-anchor="middle">Calendar</text><text x="265.0" y="574" font-size="12" font-weight="400" fill="#5F6368" text-anchor="middle">events</text><text x="200" y="630" font-size="11.5" font-weight="400" fill="#5F6368" text-anchor="middle">the leaver&#x27;s own data, read-only</text><rect x="440" y="60" width="1060" height="690" rx="12" fill="#F8FAFD" stroke="#174EA6" stroke-width="1.5" stroke-dasharray="8 6"/><text x="458" y="86" font-size="12" font-weight="700" fill="#174EA6" text-anchor="start" letter-spacing="1.4">GOOGLE CLOUD</text><text x="1482" y="86" font-size="11.5" font-weight="400" fill="#5F6368" text-anchor="end">one project · asia-southeast1 · service-account auth, no API key · secrets in Secret Manager</text><rect x="480" y="110" width="480" height="600" rx="12" fill="#fff" stroke="#1A73E8" stroke-width="2"/><g transform="translate(498,124) scale(1.0)" fill="none" stroke="#1A73E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4,6 h16 M4,12 h10 M4,18 h16"/><circle cx="18" cy="12" r="2.5"/></g><text x="530" y="141" font-size="15" font-weight="700" fill="#174EA6" text-anchor="start">Cloud Run</text><text x="530" y="159" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">the Handover app · one container</text><rect x="500.0" y="180" width="136.0" height="118" rx="10" fill="#fff" stroke="#BDC1C6" stroke-width="1.5"/><circle cx="568.0" cy="216" r="22" fill="#1A73E822" stroke="none" stroke-width="0"/><g transform="translate(554.0,202) scale(1.15)" fill="none" stroke="#1A73E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin