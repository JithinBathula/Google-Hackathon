 their Drive files</text><text x="1584" y="232" font-size="12.5" font-weight="400" fill="#202124" text-anchor="start">and Calendar events</text><circle cx="1562" cy="302" r="12" fill="#A142F4" stroke="#fff" stroke-width="2"/><text x="1562" y="306.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1584" y="298" font-size="12.5" font-weight="400" fill="#202124" text-anchor="start">Gemini extracts knowledge, raises</text><text x="1584" y="316" font-size="12.5" font-weight="400" fill="#202124" text-anchor="start">questions, interviews, answers</text><circle cx="1562" cy="386" r="12" fill="#E37400" stroke="#fff" stroke-width="2"/><text x="1562" y="390.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1584" y="382" font-size="12.5" font-weight="400" fill="#202124" text-anchor="start">Everything is stored per leaver:</text><text x="1584" y="400" font-size="12.5" font-weight="400" fill="#202124" text-anchor="start">records, questions, answers</text><circle cx="1562" cy="470" r="12" fill="#1A73E8" stroke="#fff" stroke-width="2"/><text x="1562" y="474.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1584" y="466" font-size="12.5" font-weight="400" fill="#202124" text-anchor="start">The successor asks in the web app</text><text x="1584" y="484" font-size="12.5" font-weight="400" fill="#202124" text-anchor="start">or from their AI tools over MCP</text><circle cx="1562" cy="554" r="12" fill="#188038" stroke="#fff" stroke-width="2"/><text x="1562" y="558.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="1584" y="550" font-size="12.5" font-weight="400" fill="#202124" text-anchor="start">One command builds the image</text><text x="1584" y="568" font-size="12.5" font-weight="400" fill="#202124" text-anchor="start">and deploys a new revision</text></svg>