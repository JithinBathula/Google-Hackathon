[project]
name = "handover"
version = "0.1.0"
description = "Knowledge-handover agent for departing teammates. Google Cloud AI Builder Cup 2026 entry."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "python-dotenv>=1.0",
    "google-cloud-firestore>=2.34.1",
    "google-auth>=2.61.0",
    "google-auth-oauthlib>=1.5.0",
    "google-api-python-client>=2.201.0",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
handover = "handover.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handover"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# BLE001: the pipelines deliberately catch everything per document and report it. B008: the typer idiom.
ignore = ["BLE001", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
